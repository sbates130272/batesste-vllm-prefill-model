[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-prefill-model"
version = "1.0.0"
description = "vLLM Prefix Cache Simulation and Analysis Tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Stephen Bates", email = "stebates@nvidia.com"}
]
keywords = ["vllm", "llm", "cache", "simulation", "prefix-cache", "kv-cache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core production dependencies
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "transformers>=4.35.0",
]

# Optional dependency groups
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

# For heavy ML workloads (optional)
ml = [
    "torch>=2.0.0",
    "accelerate>=0.20.0",
]

# All development dependencies
all = [
    "vllm-prefill-model[dev,ml]",
]

[project.urls]
Homepage = "https://github.com/yourusername/vllm-prefill-model"
Documentation = "https://github.com/yourusername/vllm-prefill-model#readme"
Repository = "https://github.com/yourusername/vllm-prefill-model"
Issues = "https://github.com/yourusername/vllm-prefill-model/issues"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Black code formatter configuration
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

# isort import sorting configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Flake8 configuration (in setup.cfg since flake8 doesn't support pyproject.toml)
# See .flake8 or setup.cfg for flake8 config

