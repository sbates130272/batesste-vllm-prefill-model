name: CI

on:
  push:
    branches: [ main, master, stephen ]
  pull_request:
    branches: [ main, master, stephen ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Check code formatting with black
      run: |
        black --check src/ tests/ || true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/ || true
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=100 --statistics
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v
    
    - name: Test simulator smoke test (synthetic mode)
      run: |
        cd src
        timeout 30 python3 multi_user_simulator.py \
          --num-clients 2 \
          --num-conversations 5 \
          --num-turns 2 \
          --request-rate 0 || true
    
    - name: Test simulator smoke test (text mode)
      run: |
        cd src
        timeout 30 python3 multi_user_simulator.py \
          --text-mode \
          --num-clients 2 \
          --num-conversations 5 \
          --request-rate 0 || true

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check Python syntax
      run: |
        # Check for syntax errors
        python -m py_compile src/*.py tests/*.py
    
    - name: Security check with bandit
      run: |
        pip install bandit
        bandit -r src/ -ll || true

